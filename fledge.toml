# fledge.toml — project task definitions
# Docs: https://github.com/CorvidLabs/fledge#task-runner
# Project: archon — Algorand keeper network (Algorand Python / Puya + AlgoKit)

[tasks]
build = "poetry run python -m smart_contracts build"
test = "poetry run pytest tests/ -q"
spec = "specsync check --strict"
# Requires LocalNet running (algokit localnet start):
smoke-keeper = "poetry run python -m scripts.keeper_e2e --network localnet"

[lanes.ci]
description = "Full CI pipeline: compile contract, unit tests, spec drift check"
steps = ["build", "test", "spec"]

[lanes.local]
description = "CI plus the LocalNet end-to-end test (needs algokit localnet start)"
steps = ["build", "test", "spec", "smoke-keeper"]
