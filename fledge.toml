# fledge.toml — project task definitions
# Docs: https://github.com/CorvidLabs/fledge#task-runner
# Project: arcron — Algorand keeper network (Algorand Python / Puya + AlgoKit)

[tasks]
build = "poetry run python -m smart_contracts build"
test = "poetry run pytest tests/ -q"
spec = "specsync check --strict"
# Print the hash of the contract this tree builds; add --app-id to check a deployment.
verify = "poetry run python -m scripts.verify_build --no-rebuild"

# --- Deploying ------------------------------------------------------------
# LocalNet needs no secrets. TestNet needs .env.testnet with DEPLOYER_MNEMONIC.
# MainNet additionally needs ARCRON_ALLOW_MAINNET=1, so a mistyped --network
# cannot reach real money.
deploy-localnet = "poetry run python -m scripts.deploy --network localnet"
deploy-testnet = "poetry run python -m scripts.deploy --network testnet"
deploy-mainnet = "poetry run python -m scripts.deploy --network mainnet"

# --- Governance -----------------------------------------------------------
# `status` reads whether a deployment can still be updated; `update` replaces
# its programs with this tree; `freeze` gives that up permanently. All three
# require --app-id, and freeze asks for confirmation. See docs/releases.md:
# freezing is the rc gate, not a thing to do early.
govern = "poetry run python -m scripts.govern"
smoke-govern = "poetry run python -m scripts.govern_e2e --network localnet"
smoke-multisig = "poetry run python -m scripts.multisig_e2e --network localnet"
# A real clawback, on a real chain: the mock runs no inner transactions, so
# it cannot show that a failed asset transfer would take the ALGO with it.
smoke-clawback = "poetry run python -m scripts.clawback_e2e --network localnet"
# Publish the integrator docs to the site. --check reports drift without writing.
site-docs = "poetry run python -m scripts.sync_site_docs"
# Record the live deployment as JSON, for pages that must build without a network.
snapshot = "poetry run python -m scripts.testnet_snapshot --network testnet --app-id 769891898"
# One install for the whole Bun workspace (js + web). Installing per-package
# gives each its own algosdk, and the console then bundles it twice.
js-install = "bun install"
js-test = "cd js && bun test"
web-install = "bun install"
web-test = "cd web && bun test"
web-build = "cd web && bun run ng build"
# The console as hosted on corvidlabs.xyz. Every asset it references is
# relative, so the base href is the only thing that has to know the path.
web-build-hosted = "cd web && bun run ng build --base-href /arcron/console/ --output-path dist/hosted"
web-serve = "cd web && bun run ng serve"
# Require LocalNet running (algokit localnet start):
smoke-keeper = "poetry run python -m scripts.keeper_e2e --network localnet"
# Every attack any review ever found, each asserted to be refused by its own
# guard rather than by anything incidental. See scripts/attacks.py.
attacks = "poetry run python -m scripts.attacks --network localnet"
# Pins the reference boundary in docs/arcron.md: the real keeper bot services
# a six-reference target and refuses a seven-reference one. Nothing else
# fails loudly if algokit-utils' resource populator changes shape underneath
# scripts.keeper_bot._resolve_execute_references. See scripts/reference_boundary.py.
smoke-reference-boundary = "poetry run python -m scripts.reference_boundary --network localnet"
smoke-rain = "poetry run python -m scripts.rain_demo --network localnet"
smoke-community-rain = "poetry run python -m scripts.community_rain_demo --network localnet"
smoke-subscription = "poetry run python -m scripts.subscription_demo --network localnet"
soak = "poetry run python -m scripts.keeper_soak --network localnet --minutes 3"
# A populated registry with competing keepers, asserting what has to be true
# of the whole system rather than of one upkeep. Deterministic per seed.
scenario = "poetry run python -m scripts.scenario --network localnet"

[lanes.ci]
description = "Full CI pipeline: contracts + console, unit tests, spec drift check"
steps = ["build", "test", "spec", "js-install", "js-test", "web-test", "web-build"]

[lanes.local]
description = "CI plus the LocalNet end-to-end test (needs algokit localnet start)"
steps = ["build", "test", "spec", "js-install", "js-test", "web-test", "web-build", "smoke-keeper", "smoke-rain", "smoke-community-rain", "smoke-subscription", "smoke-govern", "smoke-multisig", "smoke-clawback", "attacks", "smoke-reference-boundary"]

[lanes.endurance]
description = "The local lane plus a soak: many consecutive executions, no drift"
steps = ["build", "test", "spec", "smoke-keeper", "soak", "scenario"]
