# fledge.toml — project task definitions
# Docs: https://github.com/CorvidLabs/fledge#task-runner
# Project: arcron — Algorand keeper network (Algorand Python / Puya + AlgoKit)

[tasks]
build = "poetry run python -m smart_contracts build"
test = "poetry run pytest tests/ -q"
spec = "specsync check --strict"
web-install = "cd web && bun install"
web-test = "cd web && bun test"
web-build = "cd web && bun run ng build"
web-serve = "cd web && bun run ng serve"
# Require LocalNet running (algokit localnet start):
smoke-keeper = "poetry run python -m scripts.keeper_e2e --network localnet"
smoke-embargo = "poetry run python -m scripts.embargo_demo --network localnet"
smoke-rain = "poetry run python -m scripts.rain_demo --network localnet"
smoke-deadman = "poetry run python -m scripts.deadman_demo --network localnet"
smoke-watchdog = "poetry run python -m scripts.watchdog_demo --network localnet"
smoke-treasury = "poetry run python -m scripts.treasury_demo --network localnet"
soak = "poetry run python -m scripts.keeper_soak --network localnet --minutes 3"

[lanes.ci]
description = "Full CI pipeline: contracts + console, unit tests, spec drift check"
steps = ["build", "test", "spec", "web-install", "web-test", "web-build"]

[lanes.local]
description = "CI plus the LocalNet end-to-end test (needs algokit localnet start)"
steps = ["build", "test", "spec", "web-install", "web-test", "web-build", "smoke-keeper", "smoke-embargo", "smoke-rain", "smoke-deadman", "smoke-watchdog", "smoke-treasury"]

[lanes.endurance]
description = "The local lane plus a soak: many consecutive executions, no drift"
steps = ["build", "test", "spec", "smoke-keeper", "soak"]
