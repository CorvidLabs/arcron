name: Proposal
description: A change to what Arcron does
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is currently hard, impossible, or misleading? Concrete beats general.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Does this change the contract?
      description: >
        A deployment is upgradeable until its creator calls `freeze`. While it is
        unfrozen, a change that leaves the `Upkeep` struct and the ABI alone can be
        deployed in place and every box survives. A change to the struct or the
        surface means a new app id and a migration either way.
      options:
        - "No — scripts, console or docs only"
        - "Yes — the keeper contract's behaviour or surface"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you considered instead
      description: Including doing nothing.
