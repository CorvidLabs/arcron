# A cron-driven keeper. A stopgap, not the end state.
#
# The schedule is live, and the job skips itself cleanly when KEEPER_MNEMONIC
# is not set, so turning it on before the secret exists produces a green run
# with a notice rather than a failure every half hour that everyone learns to
# ignore.
#
# Half-hourly is chosen against the upkeeps that actually exist: the shortest
# live cadence is about six hours, so a check every thirty minutes is late by
# at most eight percent of one interval. It costs roughly 1,440 runs a month.
# On a private repository those minutes are billed, so raising the cadence is
# not free: see docs/hosting.md for the arithmetic.
#
# What this does not give you, and why it is a stopgap:
#   * Scheduled workflows are best-effort. GitHub delays them under load and
#     may drop them, which is fine for servicing upkeeps whose fees escalate
#     and poor as evidence of the continuous uptime the beta gate wants.
#   * Scheduled workflows are disabled after 60 days without repository
#     activity, silently.
#   * Each run is a fresh process, so scripts/keeper_backoff.py has no memory
#     between runs and a persistently failing upkeep is retried every time.
#   * The mnemonic lives in repository secrets, readable by any workflow here.
#
# A long-lived process avoids all four. deploy/vps/install.sh sets one up.
#
# This is the *first* of two keepers. `.github/workflows/keeper-bot-2.yml` is
# the second, on the same cron and a different account, so that the two
# actually compete rather than take turns. `--align 120` below is what makes
# that work: both hold their first scan until the next whole two-minute mark
# in UTC, so both reach for the same due upkeep in the same round window
# instead of one arriving to an empty registry seconds after the other cleared
# it. It costs a minute of wall time per run, on average, and it is the
# difference between competition and a queue.

name: Keeper bot

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Keeper app id to service
        required: false
        default: "769891898"
  schedule:
    # Every half hour. See the note above before changing this.
    - cron: "*/30 * * * *"

concurrency:
  group: keeper-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install "poetry>=2.0,<3.0"
          poetry install --only main --no-root --no-interaction

      - name: Check the keeper account is configured
        id: configured
        env:
          KEEPER_MNEMONIC: ${{ secrets.KEEPER_MNEMONIC }}
        run: |
          if [ -z "$KEEPER_MNEMONIC" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KEEPER_MNEMONIC is not set, so nothing was serviced." \
                 "Add it as a repository secret to start keeping. Until then this" \
                 "workflow is a no-op rather than a failure."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Service due upkeeps
        if: steps.configured.outputs.ready == 'true'
        env:
          KEEPER_MNEMONIC: ${{ secrets.KEEPER_MNEMONIC }}
          KEEPER_APP_ID: ${{ inputs.app_id || '769891898' }}
          ALGOD_SERVER: https://testnet-api.algonode.cloud
        run: >
          poetry run python -m scripts.keeper_bot
          --once --network testnet --log-format json --align 120
