# A manual rain scan. It was cron-driven until 2026-08-30; see the note by
# `on:` below for why the schedule went away.
#
# The rain hub gave resolve, claim and deposit back to holders on 2026-08-29,
# and scripts/rain_bot.py was reduced to a scan that changes nothing. This job
# is therefore a no-op. The schedule is gone and the app id now points at the
# hub; what remains is a button, which is the right shape for a scan.
#
# The job skips itself cleanly when RAIN_MNEMONIC is not set, so turning it
# on before the secret exists produces a green run with a notice rather than
# a failure every half hour.
#
# What this does not give you, and why it is a stopgap:
#   * Scheduled workflows are best-effort and may be delayed or dropped.
#   * Each run is a fresh process, so scripts/rain_bot.py's own pending-
#     deposit state (default_pending_path) has no memory between runs. A
#     crash between `claim` and `deposit` here is not self-healing the way
#     it is on a long-running host; the next run still sees the on-chain
#     truth (nothing allocated) and cannot know a prize is still owed to the
#     pot. A long-lived process with a real disk avoids this, the same as
#     it does for keeper-bot.yml's backoff state.
#   * The mnemonic lives in repository secrets, readable by any workflow here.

name: Rain bot

# Least privilege, declared rather than inherited.
#
# Without this a workflow takes whatever the repository's default token
# permissions happen to be. That default is `read` today, and a default is a
# setting: it can be widened later, by somebody who is not thinking about these
# files, and every workflow silently widens with it. CodeQL flagged all five.
#
# Nothing here writes. Every job checks out the repository and runs tests or a
# bot against a chain; none comments, pushes, tags, or releases. So the floor is
# the floor, and a job that ever needs more has to say so here and be noticed.
permissions:
  contents: read


on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Rain app id to watch
        required: false
        default: "770130162"
  # The schedule was removed on 2026-08-30. `scripts/rain_bot.py` was reduced
  # to a scan that changes nothing when the hub gave resolve, claim and deposit
  # back to holders, so a cron firing every thirty minutes was writing log
  # entries and nothing else. `workflow_dispatch` above still runs it by hand,
  # which is what a scan is for. Restore a schedule here if the hub ever needs
  # an automated resolver again.

concurrency:
  group: rain-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install "poetry>=2.0,<3.0"
          poetry install --only main --no-root --no-interaction

      - name: Check the rain account is configured
        id: configured
        env:
          RAIN_MNEMONIC: ${{ secrets.RAIN_MNEMONIC }}
        run: |
          if [ -z "$RAIN_MNEMONIC" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RAIN_MNEMONIC is not set, so nothing was checked." \
                 "Add it as a repository secret to start resolving. Until then this" \
                 "workflow is a no-op rather than a failure."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve, claim, redeposit
        if: steps.configured.outputs.ready == 'true'
        env:
          RAIN_MNEMONIC: ${{ secrets.RAIN_MNEMONIC }}
          RAIN_APP_ID: ${{ inputs.app_id || '770130162' }}
          ALGOD_SERVER: https://testnet-api.algonode.cloud
        run: poetry run python -m scripts.rain_bot --once --network testnet --log-format json
