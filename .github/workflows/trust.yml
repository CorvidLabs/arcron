name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The Trust gate's lifecycle stage runs `fledge lanes run verify`, and
      # that lane's first four tasks are `poetry run ...`, `bun install` and
      # `bun test`. A hosted runner has none of that, so without these steps
      # the gate dies on `poetry: not found` before it has checked anything.
      # Same actions, same versions, same inputs as the `Contracts and console`
      # job in ci.yml, because the two must agree about what the tree needs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          pip install "poetry>=2.0,<3.0"
          poetry install --no-interaction
          # The `build` task shells out to algokit to generate the typed
          # clients, and no hosted runner has it. Pinned for the same reason
          # ci.yml pins it: so the gate cannot follow algokit's next major.
          pip install "algokit>=2.0,<3.0"
          algokit --version

      # SpecSync is not installed here: the Trust action installs the pinned
      # 6.0.0 release itself and puts it on PATH, which is what the lane's
      # `spec` task needs. `web-render` is not in the verify lane, so no
      # browser is fetched either.
      - uses: CorvidLabs/trust@fcc889f54d8b4892a81af463c5a0250e2be66fc5 # v1.2.0
        id: trust
