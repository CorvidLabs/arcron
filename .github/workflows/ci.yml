# CI on CorvidLabs' own macOS runner.
#
# Every step shells out to a task in fledge.toml rather than restating the
# command, so CI and `fledge lanes run ci` cannot drift apart.
#
# Register a runner (repo Settings → Actions → Runners → New self-hosted
# runner) and give it the labels `self-hosted` and `macOS`. The runner needs
# poetry, bun, algokit and fledge on its PATH; the toolchain step below fails
# with a readable message rather than a mysterious "command not found" if any
# are missing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Pull requests from forks run here, on GitHub's infrastructure, never on the
  # self-hosted runner. A self-hosted runner executes whatever a workflow says
  # on hardware we own, so running a fork's code on it would make "open a pull
  # request" mean "run this on someone's Mac". This job gets no secrets and no
  # access to that machine.
  #
  # It cannot use `fledge`, which is not installed on a hosted runner, so it
  # reads the task commands out of fledge.toml instead of restating them —
  # same single source of truth, no drift.
  fork-checks:
    name: Contracts and console (fork)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: tests/test_verify_release.py checks that the release
      # record names a commit this repository contains, and that drift
      # detection still reports the commits it is supposed to. A shallow
      # clone of a merge commit resolves neither, and the failure looks
      # like a broken test rather than a missing checkout option.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          pip install "poetry>=2.0,<3.0"
          poetry install --no-interaction

      # The `spec` task below is `specsync check --strict`, and SpecSync is a
      # Rust binary that no hosted runner has and no dependency file installs.
      # Without this step the loop dies on `specsync: command not found`. That
      # has never been observed only because forking is disabled while the
      # repository is private; it is waiting for the first fork pull request
      # after it goes public.
      #
      # This is also the only place a version is pinned. `.specsync/version`
      # looks like one and is not: it records the on-disk lifecycle format,
      # which SpecSync 6.0 still stamps as 5.0.0. Nothing else in the tree
      # names a SpecSync version, so until now "the version CI gates on" was
      # whatever happened to be on one Mac's PATH.
      #
      # `version` has to be given explicitly: the action defaults to `6.0.0`
      # and no such release exists yet — the 6.0 line is still candidates.
      # The action puts SpecSync on PATH and runs `check --force --strict`
      # itself; `--force` is the right CI invocation, because the hash cache
      # is not committed and a warm workspace can otherwise report "all specs
      # unchanged" and exit 0 over a check that validated nothing. The `spec`
      # task still runs in the loop below, so this job's idea of the gate
      # still comes from fledge.toml.
      - name: SpecSync
        uses: CorvidLabs/spec-sync@v6.0.0-rc.7
        with:
          version: 6.0.0-rc.7
          strict: "true"

      - name: Run the CI lane's tasks
        run: |
          # Read each command from fledge.toml so this job and `fledge lanes
          # run ci` cannot disagree about what CI means.
          run_task() {
            local command
            command=$(python -c "import tomllib,sys; print(tomllib.load(open('fledge.toml','rb'))['tasks'][sys.argv[1]])" "$1")
            echo "::group::$1 — $command"
            eval "$command"
            echo "::endgroup::"
          }
          for task in build test spec web-install web-test web-build web-build-hosted web-verify-hosted; do
            run_task "$task"
          done

      - name: Contract artifacts are current
        run: |
          if ! git diff --quiet -- smart_contracts/artifacts; then
            echo "::error::Artifacts differ from a fresh build — run 'poetry run python -m smart_contracts build' and commit."
            git --no-pager diff --stat -- smart_contracts/artifacts
            exit 1
          fi

  build-and-test:
    name: Contracts and console
    # A self-hosted runner executes whatever the workflow says on hardware we
    # own, so never run a fork's code on it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # Full history: tests/test_verify_release.py checks that the release
        # record names a commit this repository contains, and that drift
        # detection still reports what it should. A shallow clone of a merge
        # commit resolves neither.
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          missing=()
          # specsync belongs here: `fledge run spec` is a required step three
          # steps down, and without this it fails as a bare "command not
          # found" attributed to the spec drift step rather than to the
          # runner. It is not installed by poetry, bun, or fledge.
          for tool in poetry bun fledge specsync; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing on this runner: ${missing[*]}"
            echo "Install them, or see .github/workflows/ci.yml for what CI expects."
            exit 1
          fi
          poetry --version && bun --version && fledge --version
          # Printed, not asserted. This job takes SpecSync from the
          # runner's PATH — only the fork job can pin a version — so the log
          # is the sole record of what gated a push. It cannot be asserted
          # either way: every 6.0 candidate self-reports `specsync 6.0.0`,
          # so the string cannot tell rc.5 from rc.7.
          specsync --version

      - name: Select the Python interpreter
        run: |
          # Must happen before installing: a fresh checkout has no .venv, so
          # poetry would otherwise take the default python3 — which on this
          # runner is 3.14, and coincurve publishes no wheels for 3.14. The
          # install then tries to build it from source and fails obscurely.
          if ! command -v python3.13 >/dev/null 2>&1; then
            echo "::error::python3.13 not found on this runner (default is $(python3 --version 2>&1))"
            exit 1
          fi
          poetry env use "$(command -v python3.13)"
          poetry run python --version

      - name: Install Python dependencies
        run: poetry install --no-interaction

      - name: Python version guard
        run: |
          # Belt and braces: assert what actually got installed into.
          version=$(poetry run python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Python $version"
          case "$version" in
            3.12|3.13) ;;
            *) echo "::error::Python $version is unsupported — use 3.13 (never 3.14)"; exit 1 ;;
          esac

      - name: Build contracts
        run: fledge run build

      - name: Unit tests
        run: fledge run test

      - name: Spec drift
        run: fledge run spec

      - name: Contract artifacts are current
        run: |
          # A contract change with stale artifacts means the bot and console
          # are compiled against something that is no longer the source.
          if ! git diff --quiet -- smart_contracts/artifacts; then
            echo "::error::Artifacts differ from a fresh build — run 'poetry run python -m smart_contracts build' and commit."
            git --no-pager diff --stat -- smart_contracts/artifacts
            exit 1
          fi

      - name: JavaScript dependencies
        run: fledge run js-install

      - name: Contract TypeScript tests
        # The decoder here is the twin of the Python one and is pinned to the
        # same recorded box; these run beside the contract on purpose.
        run: fledge run js-test

      - name: Console tests
        run: fledge run web-test

      - name: Console build
        run: fledge run web-build

      - name: Hosted console build
        # The bundle that goes to corvidlabs.xyz. It differs from the build
        # above by one attribute, and that attribute is the whole difference
        # between a working page and one that 404s its own JavaScript.
        run: fledge run web-build-hosted

      - name: Hosted console loads at its subpath
        run: fledge run web-verify-hosted

  localnet:
    name: LocalNet end-to-end
    # The chain-facing half: slower, needs Docker, and proves the things mocks
    # cannot. Kept off pull requests so the fast checks stay fast.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # Full history: tests/test_verify_release.py checks that the release
        # record names a commit this repository contains, and that drift
        # detection still reports what it should. A shallow clone of a merge
        # commit resolves neither.
        with:
          fetch-depth: 0

      - name: Docker and AlgoKit
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is not running on this runner; LocalNet needs it."
            exit 1
          fi
          command -v algokit >/dev/null 2>&1 || { echo "::error::algokit is not installed"; exit 1; }
          algokit --version

      - name: Select the Python interpreter
        run: poetry env use "$(command -v python3.13)"

      - name: Install Python dependencies
        run: poetry install --no-interaction

      - name: Start LocalNet
        run: |
          algokit localnet start
          # Wait for algod to answer rather than assuming it is up.
          for attempt in $(seq 1 30); do
            if curl -sf -H "X-Algo-API-Token: $(printf 'a%.0s' {1..64})" \
                 http://localhost:4001/v2/status >/dev/null; then
              echo "algod is up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::algod did not become ready"
          exit 1

      - name: Build contracts
        run: fledge run build

      - name: Keeper end-to-end
        run: fledge run smoke-keeper

      - name: Daily rain demo
        run: fledge run smoke-rain

      - name: LocalNet state on failure
        if: failure()
        run: |
          # A failed chain test is much easier to read with the chain's own view.
          algokit localnet status || true
          docker ps --filter name=algokit --format '{{.Names}}\t{{.Status}}' || true
