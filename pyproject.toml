[tool.poetry]
name = "arcron"
version = "0.1.0"
description = "Arcron — a permissionless keeper network for Algorand"
authors = ["0xLeif <leif.algo@pm.me>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
# Upper bound is load-bearing: coincurve publishes no wheels for 3.14, so
# poetry must refuse it rather than trying to build from source.
python = ">=3.12,<3.14"
algokit-utils = "^4.0.0"
python-dotenv = "^1.0.0"
algorand-python = "^3"

[tool.poetry.group.dev.dependencies]
algokit-client-generator = "^2.1.0"
puyapy = ">=5.0,<5.10"
pytest = "^9.1.1"
# Only tests/ import it, and it is what pulls in python-ecdsa, whose Minerva
# P-256 timing advisory has no patched version. Algorand signs with Ed25519 and
# nothing here touches P-256, but a testing library has no business in the
# dependency set a keeper operator installs.
algorand-python-testing = "^1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

