[tool.poetry]
name = "archon"
version = "0.1.0"
description = "Archon — a permissionless keeper network for Algorand"
authors = ["0xLeif <leif.algo@pm.me>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
algokit-utils = "^4.0.0"
python-dotenv = "^1.0.0"
algorand-python = "^3"
algorand-python-testing = "^1"
py-algochat = {path = "../../py-algochat"}

[tool.poetry.group.dev.dependencies]
algokit-client-generator = "^2.1.0"
puyapy = ">=5.0,<5.10"
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

