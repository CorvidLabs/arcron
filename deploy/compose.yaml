# An always-on keeper for the TestNet deployment.
#
#   cp deploy/keeper.env.example deploy/keeper.env   # add KEEPER_MNEMONIC
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml logs -f
#
# Upgrading from a version before 2026-08-26 needs both flags:
#
#   docker compose -f deploy/compose.yaml down -v
#   docker compose -f deploy/compose.yaml up -d --build
#
# `--build` because `up -d` alone reuses the image it already has, and the
# notifier's state directory is fixed in the Dockerfile. `-v` because Docker
# sets a volume's ownership only when it creates it: an existing
# `notifier-state` from the broken image stays root-owned however many times
# the image is rebuilt, and the notifier keeps logging "Permission denied"
# against a fix that is present and correct. Dropping the volume costs one
# round of re-announcements and nothing else.
#
# The bot earns its own fees, so a funded account is self-sustaining while the
# registry is busy — but it cannot earn its way back from empty. Watch the
# balance (see docs/arcron.md, "Operating a bot").

services:
  keeper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arcron-keeper
    env_file: keeper.env
    command: ["--log-format", "json"]
    # A missing or half-filled keeper.env is a configuration mistake, and
    # `restart: unless-stopped` turns that into a crash loop that scrolls the
    # real error off the screen. Stop after a few tries so the message is the
    # last thing in the log rather than the ten thousandth.
    restart: on-failure:3
    # SIGTERM lets it finish the scan in flight before exiting.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Read-only. It holds no keys and cannot sign anything — see
  # scripts/notifier.py, where a test enforces that.
  notifier:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arcron-keeper
    restart: unless-stopped
    env_file: notifier.env
    entrypoint: ["python", "-m", "scripts.notifier"]
    # No --ours here: compose cannot interpolate a value from env_file into a
    # command, so the notifier reads ARCRON_OURS from its own environment.
    # Without it this container watched MainNet with nobody counted as a
    # stranger, which the systemd unit never did.
    command: []
    stop_signal: SIGTERM
    stop_grace_period: 15s
    volumes:
      # Remember what has been announced, so a restart is quiet.
      - notifier-state:/home/keeper/.local/state/arcron
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  notifier-state:
