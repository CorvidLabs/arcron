# A MainNet algod of our own, beside the keeper, so no public endpoint is in
# the loop between the bot and the chain.
#
#   docker compose -f deploy/vps/algod.compose.yaml up -d
#   docker compose -f deploy/vps/algod.compose.yaml logs -f
#   curl -s -H "X-Algo-API-Token: $ALGOD_TOKEN" localhost:8080/v2/status | jq .last-round
#
# Why. The free public endpoint sheds requests once a daily quota is crossed
# (scripts/node_retry.py, "Whose quota this is"), and the laptop keeper was
# refused 4,949 times in one log. A keeper that cannot read the registry
# misses executions; a notifier that cannot read it misses a stranger, and on
# an unfrozen MainNet deployment a stranger is the event everything turns on.
# A node answers only us.
#
# What it costs. A non-archival MainNet node with fast catch-up is a few tens
# of GB of disk and about an hour to catch up from a fresh start; it keeps up
# on a small VPS after that. It needs port 4160 reachable for gossip.
#
# The image is the Algorand Foundation's; its environment variables are
# documented at https://github.com/algorand/go-algorand/tree/master/docker.
# Check there before changing anything below. Generate TOKEN once with
# `openssl rand -hex 32` and put the same value in /etc/arcron/keeper.env and
# notifier.env as ALGOD_TOKEN, with ALGOD_SERVER=http://127.0.0.1:8080.
services:
  algod:
    image: algorand/algod:stable
    container_name: arcron-algod
    restart: unless-stopped
    environment:
      NETWORK: mainnet
      FAST_CATCHUP: "1"
      TOKEN: "${ALGOD_TOKEN:?set ALGOD_TOKEN in the shell or a .env beside this file}"
    ports:
      # The REST API, bound to loopback: only processes on this host may ask.
      - "127.0.0.1:8080:8080"
      # Gossip, which peers need to reach.
      - "4160:4160"
    volumes:
      - algod-data:/algod/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  algod-data:
